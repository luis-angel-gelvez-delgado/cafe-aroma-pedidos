spring.application.name=cafe-aroma-pedidos
server.port=8080

# --- MySQL ---
# Las credenciales NO se escriben aquí: se leen de variables de entorno.
# Si DB_PASSWORD no está definida, la aplicación no arranca (error explícito, no un valor por defecto).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cafe_aroma}?serverTimezone=America/Bogota
spring.datasource.username=${DB_USERNAME:cafe_app}
spring.datasource.password=${DB_PASSWORD}

# --- Esquema ---
# Las tablas las crea schema.sql (SQL escrito y revisado por nosotros), no Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# Las consultas a la BD solo ocurren dentro de los servicios.
spring.jpa.open-in-view=false

# --- Thymeleaf ---
# Ver cambios del HTML sin reiniciar (solo desarrollo).
spring.thymeleaf.cache=false
